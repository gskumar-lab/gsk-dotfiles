
# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd =  mmsg dispatch enable_monitor,eDP-1
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# -------------------------------------------------
# 30 sec - Reduce brightness
# -------------------------------------------------

listener {
    timeout = 30

    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r 
}

# -------------------------------------------------
# 2 min - Lock screen
# -------------------------------------------------

listener {
    timeout = 120

    on-timeout = noctalia msg session lock
}

# -------------------------------------------------
# 30 sec - Turn displays off
# -------------------------------------------------

listener {
    timeout = 60

    on-timeout = mmsg dispatch disable_monitor,eDP-1
    on-resume = mmsg dispatch enable_monitor,eDP-1 
}

# -------------------------------------------------
# 15 min - Suspend system
# -------------------------------------------------

listener {
    timeout = 900

    on-timeout = systemctl suspend
}

# -------------------------------------------------
# Lock immediately before suspend
# -------------------------------------------------

listener {
    timeout = 895

    on-timeout = noctalia msg session lock
}

